title = "ZentrixPay gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Placeholder values in env examples and docs"
paths = [
  '''(?:^|/)server/\.env\.example$''',
  '''(?:^|/)\.env\.example$''',
  # A pnpm store was committed by mistake in June 2026 and removed in October;
  # its files are third-party packages' own test fixtures.
  '''^\.pnpm-store/''',
]

regexTarget = "match"
regexes = [
  '''G\.\.\.''',
  '''S\.\.\.''',
  '''C\.\.\.''',
  '''sk-or-\.\.\.''',
  '''eyJ\.\.\.''',
  '''postgres\.xxx''',
  '''password@aws''',
  '''xxx\.supabase\.co''',
  '''YOUR_API_KEY''',
  '''zp_live_9f3c\.\.\.e21a''',
]
