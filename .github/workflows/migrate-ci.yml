name: Migrate CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zentrixpay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/zentrixpay

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm db:migrate

      - name: Verify migrations are idempotent (run twice)
        run: pnpm db:migrate

      - name: Verify tables exist
        run: |
          set -euo pipefail
          for table in publishers apis api_calls api_passes api_credit_balances api_credit_ledger; do
            exists=$(psql "$DATABASE_URL" -tAc "SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = '$table'")
            if [ "$exists" != "1" ]; then
              echo "Missing expected table: $table"
              exit 1
            fi
          done
          echo "All expected tables exist."

      - name: Verify key columns exist
        run: |
          set -euo pipefail
          # Check apis.webhook_url
          exists=$(psql "$DATABASE_URL" -tAc "SELECT 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'apis' AND column_name = 'webhook_url'")
          if [ "$exists" != "1" ]; then
            echo "Missing column: apis.webhook_url"
            exit 1
          fi
          # Check apis.streaming_enabled
          exists=$(psql "$DATABASE_URL" -tAc "SELECT 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'apis' AND column_name = 'streaming_enabled'")
          if [ "$exists" != "1" ]; then
            echo "Missing column: apis.streaming_enabled"
            exit 1
          fi
          # Check api_calls.refund_status
          exists=$(psql "$DATABASE_URL" -tAc "SELECT 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'api_calls' AND column_name = 'refund_status'")
          if [ "$exists" != "1" ]; then
            echo "Missing column: api_calls.refund_status"
            exit 1
          fi
          echo "All key columns exist."

  # A change to server/src/db/schema.ts without a matching migration (or the
  # reverse) fails here (#189). Builds one database from the migrations and
  # one from schema.ts, then diffs columns, constraints, indexes and enums.
  schema-drift:
    name: Schema drift between schema.ts and migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compare migrated database with schema.ts
        env:
          PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bash server/scripts/check-schema-drift.sh
